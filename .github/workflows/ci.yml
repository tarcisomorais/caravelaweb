name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -p 'test_*.py' -v

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Run full suite
        shell: bash
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Real end-to-end Windows evidence
        # ponytail: real-network exercise, not a unit test; a rare network
        # blip must not block merges. Non-blocking.
        continue-on-error: true
        shell: bash
        run: |
          set -e
          ROOT="$RUNNER_TEMP/windows-evidence"
          mkdir -p "$ROOT"
          python tests/windows_real_task_exercise.py setup --root "$ROOT"
          python tests/windows_real_task_exercise.py operate --root "$ROOT"
          python tests/windows_real_task_exercise.py discover --root "$ROOT"
          python tests/windows_real_task_exercise.py verify --root "$ROOT"

  path-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Root-as-skill path gate
        # The repository root is the skill root. The only nested skill path
        # is the shared thin plugin adapter skills/caravelaweb/SKILL.md,
        # plus the host-discovery adapters under .claude/ and .agents/.
        # The deterministic suite proves each adapter stays thin and defers
        # to the root contract; this gate proves nothing else grows under
        # skills/.
        run: |
          test -f skills/caravelaweb/SKILL.md
          test "$(find skills -type f)" = "skills/caravelaweb/SKILL.md"
